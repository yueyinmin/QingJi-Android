org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
# build cache 关掉：2026-11-16 实测本机在 FROM-CACHE 解包时卡死在
# FileOutputStream.open0（TarBuildCacheEntryPacker.unpackFile），线程 RUNNABLE 但 CPU 不动。
# 关掉后任务真正重新执行，慢一点但不会卡死。
org.gradle.caching=false

# Kotlin 编译守护进程（独立 JVM）。
# 不显式给堆时它可能按默认大堆申请而在这台 16G / 空闲不足 4G 的机器上启动失败，
# 表现就是 Gradle 日志里「Could not connect to Kotlin compile daemon」重试 4 次后
# 回退到 in-process 编译，然后极慢。preferIPv4Stack 避免 Windows 上 IPv6/IPv4 抢连接。
kotlin.daemon.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ------------------------------------------------------------
# 这个工程放在中文目录「体重管理App」下面。
# 安卓官方构建工具（AGP）默认会拒绝含中文的路径，直接报
# "Your project path contains non-ASCII characters" 并停止构建。
# 加这一行是告诉它「我知道，出问题我自己负责」，放行继续编译。
# 实测本机（AGP 8.7.3 + build-tools 35）放行后可以正常打包。
# 万一以后换电脑 / 换工具版本后又报路径相关的怪错，
# 最省事的办法是把整个 QingJi-Android 文件夹复制到纯英文路径，
# 例如 D:\dev\QingJi-Android，再重新编译。
# ------------------------------------------------------------
android.overridePathCheck=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
