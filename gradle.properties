org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ------------------------------------------------------------
# 这个工程放在中文目录「体重管理App」下面。
# 安卓官方构建工具（AGP）默认会拒绝含中文的路径，直接报
# "Your project path contains non-ASCII characters" 并停止构建。
# 加这一行是告诉它「我知道，出问题我自己负责」，放行继续编译。
# 实测本机（AGP 8.7.3 + build-tools 35）放行后可以正常打包。
# 万一以后换电脑 / 换工具版本后又报路径相关的怪错，
# 最省事的办法是把整个 QingJi-Android 文件夹复制到纯英文路径，
# 例如 D:\dev\QingJi-Android，再重新编译。
# ------------------------------------------------------------
android.overridePathCheck=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
